name: release

on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/LockedIn.App -c Release -r win-x64 --self-contained -o artifacts/publish -p:Version=$version -p:DebugType=none

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & $iscc /DAppVersion=$version installer\LockedIn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/locked-in-setup-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/LockedIn.Tests --configuration Release

      - name: Build packages
        run: sh packaging/linux/build-packages.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
          if-no-files-found: error

  # Published only once both builds succeed, so the Windows auto-updater never sees a half-finished release.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Locked In $TAG" --generate-notes
          fi
