name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/LockedIn.App -c Release -r win-x64 --self-contained -o artifacts/publish -p:Version=$version -p:DebugType=none

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & $iscc /DAppVersion=$version installer\LockedIn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $installer = Get-Item artifacts\locked-in-setup-*.exe
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName --clobber
          } else {
            gh release create $tag $installer.FullName --title "locked-in $tag" --generate-notes
          }
