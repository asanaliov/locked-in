name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Compiles the installer too, so a broken installer script shows up on the PR, not at release time.
      - name: Build installer
        shell: pwsh
        run: |
          dotnet publish src/LockedIn.App -c Release -r win-x64 --self-contained -o artifacts/publish -p:DebugType=none
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=0.0.0 installer\LockedIn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
